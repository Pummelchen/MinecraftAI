name: Bug Report
description: Report a reproducible bug or regression
title: "[Bug] "
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What should be fixed?
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened? Include exact error text when safe.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and evidence
      description: Provide the smallest safe reproduction, logs, screenshots, or artifact references. Do not include secrets or private client data.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: List the affected files, commands, APIs, versions, and behavior that must remain unchanged.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] The issue is reproduced by a focused test or fixture.
        - [ ] The expected behavior is restored.
        - [ ] Relevant regression tests pass.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: List the smallest safe commands from the wiki Command Reference first.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      options: [Low, Medium, High, Critical]
    validations:
      required: true
  - type: dropdown
    id: human-review
    attributes:
      label: Human review required
      options: ["No", "Yes"]
    validations:
      required: true
  - type: textarea
    id: human-review-reason
    attributes:
      label: Human review reason
      description: Explain any production, security, database, release, world, RCON, service, or client-update impact.
    validations:
      required: true
