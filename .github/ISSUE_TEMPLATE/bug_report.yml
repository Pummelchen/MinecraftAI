name: Bug Report
description: Report a reproducible bug or regression
title: "[Bug] "
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What bug should be fixed?
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened? Include exact error text when safe.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Specific files, directories, commands, APIs, docs, or behavior in scope.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: What must not be changed.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction or evidence
      description: Safe reproduction steps, logs, screenshots, or artifact references. Do not include secrets.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Relevant files/directories
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Smallest safe commands first. Prefer commands from `.ai/COMMANDS.md`.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true
  - type: dropdown
    id: human-review
    attributes:
      label: Human review required
      options:
        - "No"
        - "Yes"
    validations:
      required: true
  - type: textarea
    id: human-review-reason
    attributes:
      label: Human review reason
    validations:
      required: true
  - type: dropdown
    id: codex-suitability
    attributes:
      label: Codex suitability
      options:
        - Safe for Codex
        - Needs Human Context
        - Do Not Autocode
    validations:
      required: true
  - type: textarea
    id: codex-instructions
    attributes:
      label: Codex instructions
    validations:
      required: true
  - type: dropdown
    id: expected-pr-size
    attributes:
      label: Expected PR size
      options:
        - Small
        - Medium
        - Large
    validations:
      required: true
  - type: textarea
    id: project-fields
    attributes:
      label: Project fields
      placeholder: |
        Phase: M...
        Priority: P...
        Area: ...
        Risk: ...
        Codex suitability: ...
        Evidence required: Yes/No
    validations:
      required: true
