name: Production / Human Review Task
description: Track a production-sensitive decision or guarded operation
title: "[Human Review] "
body:
  - type: markdown
    attributes:
      value: |
        Use this for production services, credentials, security policy, database mutation, release activation, live promotion, RCON, world reset, or client-update control. Creating the issue does not authorize the operation.
  - type: textarea
    id: objective
    attributes:
      label: Objective
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: Identify exact services, versions, files, databases, commands, and actions that remain prohibited.
    validations:
      required: true
  - type: textarea
    id: decision-needed
    attributes:
      label: Human decision needed
      description: State the exact approval or policy choice required.
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Backup and rollback plan
      description: Explain how current state is preserved and restored.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] The owner decision is recorded.
        - [ ] Dry-run or disposable validation is complete where available.
        - [ ] Production evidence and rollback state are identified.
        - [ ] No mutation occurs before explicit approval.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation and evidence
      description: Separate local/disposable evidence from live operator evidence.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      options: [High, Critical, Medium, Low]
    validations:
      required: true
  - type: dropdown
    id: approval
    attributes:
      label: Human approval recorded
      options: ["No", "Yes"]
    validations:
      required: true
