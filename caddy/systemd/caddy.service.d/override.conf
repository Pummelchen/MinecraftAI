# Drop-in for the packaged caddy.service.
# Install to /etc/systemd/system/caddy.service.d/override.conf
#
# Repoints Caddy at the master config in /var/caddy and keeps its state
# (certificates, ACME account keys, OCSP staples) there too, so everything
# the edge owns lives under one directory.

[Service]
Environment=XDG_DATA_HOME=/var/caddy/data
Environment=XDG_CONFIG_HOME=/var/caddy/config
Environment=CADDY_LOG_DIR=/var/log/caddy

ExecStart=
ExecStart=/usr/bin/caddy run --environ --config /var/caddy/Caddyfile

ExecReload=
ExecReload=/usr/bin/caddy reload --config /var/caddy/Caddyfile --force

ReadWritePaths=/var/caddy /var/log/caddy
