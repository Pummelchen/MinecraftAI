name: Documentation Update
description: Correct or improve the project wiki, README, contracts, or component documentation
title: "[Docs] "
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What documentation should be corrected or added?
    validations:
      required: true
  - type: textarea
    id: source-evidence
    attributes:
      label: Source evidence
      description: Cite the current source, configuration, tests, or production contract that supports the update.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: List the wiki pages or repository documents in scope and what should remain unchanged.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Current source or configuration was checked.
        - [ ] Links and referenced paths are valid.
        - [ ] No secrets or private production data are included.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: List link, path, formatting, or source-consistency checks.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      options: [Low, Medium, High, Critical]
    validations:
      required: true
  - type: dropdown
    id: human-review
    attributes:
      label: Human review required
      options: ["No", "Yes"]
    validations:
      required: true
  - type: textarea
    id: human-review-reason
    attributes:
      label: Human review reason
      description: Security, deployment, migration, release, or production-policy documentation requires owner review.
    validations:
      required: true
