name: Release Gate Evidence
description: Track proof required before release activation or approval
title: "[Release Gate] "
body:
  - type: markdown
    attributes:
      value: |
        Do not fabricate soak reports, release-health records, migration results, checksums, service status, or test output.
  - type: textarea
    id: objective
    attributes:
      label: Objective
    validations:
      required: true
  - type: textarea
    id: release
    attributes:
      label: Release and artifact identity
      description: Include release ID, Minecraft version, artifact names, and checksums where available.
    validations:
      required: true
  - type: textarea
    id: local-evidence
    attributes:
      label: Local or disposable evidence
      description: List evidence generated safely from source, fixtures, or disposable state.
    validations:
      required: true
  - type: textarea
    id: operator-evidence
    attributes:
      label: Operator or production evidence
      description: List evidence requiring the live host, credentials, account state, Minecraft connectivity, Caddy/systemd state, or release approval.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Artifact metadata and checksums agree.
        - [ ] Required tests and smoke checks passed.
        - [ ] DMG soak evidence matches the exact DMG when applicable.
        - [ ] Operator evidence is complete.
        - [ ] Release approval is explicitly recorded.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation commands
      description: List exact commands and whether each was actually run.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      options: [Low, Medium, High, Critical]
    validations:
      required: true
  - type: dropdown
    id: human-review
    attributes:
      label: Human review required
      options: ["Yes", "No"]
    validations:
      required: true
